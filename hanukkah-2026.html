<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanukkah 2026 Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --ice: #eef4fc;
    --blue: #1b3f8b;
    --deep-blue: #0f2860;
    --gold: #c9971c;
    --light-gold: #f2d27a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--deep-blue);
    background: linear-gradient(180deg, var(--white) 0%, var(--ice) 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 2.5rem 1.25rem 3rem;
    min-height: 100vh;
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 8vw, 4rem);
    color: var(--blue);
    margin: 0.5rem 0 0.25rem;
    text-align: center;
    letter-spacing: 0.01em;
  }
  .rule { width: 90px; height: 3px; background: var(--gold); border-radius: 2px; margin: 0.5rem auto 1.5rem; }
  #menorah { width: min(400px, 92vw); height: auto; display: block; margin: 0 auto; }
  .flame { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; }
  .lit .flame { animation: light 0.6s ease-out forwards, flicker 1.6s ease-in-out 0.6s infinite; }
  @keyframes light { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes flicker { 0%,100% { transform: scale(1) rotate(-1deg); } 50% { transform: scale(1.08, 0.94) rotate(1.5deg); } }

  .card {
    background: var(--white);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 1.75rem 1.5rem;
    width: min(460px, 100%);
    box-shadow: 0 10px 30px rgba(27, 63, 139, 0.12);
    margin-top: 1.25rem;
  }
  .card p { margin: 0 0 1rem; line-height: 1.55; }
  label { display: block; font-weight: 700; margin-bottom: 0.4rem; color: var(--blue); }
  .row { display: flex; gap: 0.6rem; }
  input[type=text] {
    flex: 1; min-width: 0;
    font: inherit; padding: 0.7rem 0.85rem;
    border: 2px solid var(--blue); border-radius: 8px;
    color: var(--deep-blue); background: var(--white);
  }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    padding: 0.7rem 1.2rem; border: 0; border-radius: 8px;
    background: var(--blue); color: var(--white);
    transition: background 0.15s;
  }
  button:hover { background: var(--deep-blue); }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #error { min-height: 1.4em; margin: 0.7rem 0 0; color: #a12b2b; font-weight: 700; }
  .shake { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  #prize { display: none; text-align: center; }
  #prize h2 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2rem; color: var(--blue); margin: 0 0 0.5rem; }
  #prize p { margin: 0; font-size: 1.1rem; }
  .won #puzzle { display: none; }
  .won #prize { display: block; }

  .confetti { position: fixed; top: -20px; pointer-events: none; z-index: 10; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  @media (prefers-reduced-motion: reduce) {
    .lit .flame { animation: none; opacity: 1; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
  <h1>Hanukkah 2026 Puzzle</h1>
  <div class="rule"></div>

  <svg id="menorah" viewBox="0 0 400 260" role="img" aria-label="A menorah with nine candles">
    <defs>
      <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0">
        <stop offset="0" stop-color="#b8860b"/><stop offset="0.35" stop-color="#f2d27a"/>
        <stop offset="0.5" stop-color="#d4a62a"/><stop offset="0.65" stop-color="#f2d27a"/>
        <stop offset="1" stop-color="#b8860b"/>
      </linearGradient>
      <linearGradient id="candle" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1b3f8b"/><stop offset="0.45" stop-color="#4d79c9"/>
        <stop offset="1" stop-color="#15337a"/>
      </linearGradient>
      <radialGradient id="flameGrad" cx="0.5" cy="0.75" r="0.6">
        <stop offset="0" stop-color="#fff6d6"/><stop offset="0.5" stop-color="#f7cf5c"/>
        <stop offset="1" stop-color="#e49a1a"/>
      </radialGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#f2d27a" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#f2d27a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="arms"></g>
    <rect x="193" y="98" width="14" height="136" rx="3" fill="url(#gold)"/>
    <ellipse cx="200" cy="168" rx="13" ry="6" fill="url(#gold)"/>
    <ellipse cx="200" cy="196" rx="13" ry="6" fill="url(#gold)"/>
    <path d="M140 256 Q140 240 172 236 L228 236 Q260 240 260 256 Z" fill="url(#gold)"/>
    <rect x="128" y="252" width="144" height="6" rx="3" fill="url(#gold)"/>
    <g id="candles"></g>
  </svg>

  <main class="card" id="card">
    <div id="puzzle">
      <p>Solve the puzzle you were given to find the secret password. Type it in below and press Unlock to claim your prize.</p>
      <label for="pw">Secret password</label>
      <div class="row">
        <input type="text" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" id="go">Unlock</button>
      </div>
      <p id="error" role="alert"></p>
    </div>
    <div id="prize">
      <h2>Chag Sameach!</h2>
      <p>Congratulations, you solved it! A prize will be arriving at your house soon.</p>
    </div>
  </main>

<script>
/* ============ SETTINGS: edit this section ============ */
const PASSWORDS = [
  { id: "Password 1", value: "dreidel" },   // replace with your first password
  { id: "Password 2", value: "gelt" }       // replace with your second password
];
// Email setup: deploy the Google Apps Script described in the setup steps,
// then paste its web app URL here (looks like https://script.google.com/macros/s/.../exec).
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaJTd_fv6JgzOr1KsMhPtDkIYABhLh1ym6IDxj821KseIHWa0HDim-uJn0lpWv9TMy/exec";
/* ====================================================== */

const input = document.getElementById("pw");
const err = document.getElementById("error");
const card = document.getElementById("card");

// Build the menorah: four curved arms on each side, shamash (helper candle) in the center.
const NS = "http://www.w3.org/2000/svg";
const CX = 200;
const arms = document.getElementById("arms");
const candles = document.getElementById("candles");
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
for (let k = 1; k <= 4; k++) {
  [-1, 1].forEach(side => {
    const x = CX + side * 40 * k;
    el("path", { d: "M" + CX + " 206 C " + x + " 206 " + x + " 190 " + x + " 134",
      fill: "none", stroke: "url(#gold)", "stroke-width": 7, "stroke-linecap": "round" }, arms);
  });
}
for (let i = 0; i < 9; i++) {
  const x = CX + (i - 4) * 40;
  const mid = i === 4;
  const cupTop = mid ? 100 : 128;
  const h = mid ? 48 : 38;
  const candleTop = cupTop - h;
  el("path", { d: "M" + (x - 12) + " " + cupTop + " L" + (x + 12) + " " + cupTop + " L" + (x + 7) + " " + (cupTop + 10) +
    " Q" + x + " " + (cupTop + 14) + " " + (x - 7) + " " + (cupTop + 10) + " Z", fill: "url(#gold)" }, candles);
  el("rect", { x: x - 6, y: candleTop, width: 12, height: h, rx: 2, fill: "url(#candle)" }, candles);
  el("line", { x1: x, y1: candleTop, x2: x, y2: candleTop - 5, stroke: "#3a2a10", "stroke-width": 1.5, "stroke-linecap": "round" }, candles);
  const flame = el("g", { class: "flame" }, candles);
  const delay = Math.abs(i - 4) * 0.35;
  flame.style.animationDelay = delay + "s, " + (delay + 0.6) + "s";
  el("circle", { cx: x, cy: candleTop - 20, r: 26, fill: "url(#glow)" }, flame);
  const fy = candleTop - 4;
  el("path", { d: "M" + x + " " + fy + " C " + (x + 10) + " " + fy + " " + (x + 8) + " " + (fy - 14) + " " + x + " " + (fy - 30) +
    " C " + (x - 8) + " " + (fy - 14) + " " + (x - 10) + " " + fy + " " + x + " " + fy + " Z", fill: "url(#flameGrad)" }, flame);
}

function celebrate() {
  document.getElementById("menorah").classList.add("lit");
  const colors = ["#c9971c", "#f2d27a", "#1b3f8b", "#6f95d8"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    const size = 8 + Math.random() * 8;
    c.style.left = Math.random() * 100 + "vw";
    c.style.width = size + "px";
    c.style.height = size + "px";
    c.style.background = colors[i % colors.length];
    c.style.clipPath = i % 2 ? "polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)" : "none";
    c.style.borderRadius = i % 2 ? "0" : "50%";
    c.style.animationDuration = (3 + Math.random() * 3) + "s";
    c.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 8000);
  }
}

function notifyAdmin(which) {
  if (!APPS_SCRIPT_URL) { console.warn("No APPS_SCRIPT_URL set, so no email was sent."); return; }
  // text/plain + no-cors avoids a browser preflight, which Apps Script does not support.
  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ password: which })
  }).catch(() => {});
}

let solved = false;
function check() {
  if (solved) return;
  const guess = input.value.trim().toLowerCase();
  const hit = PASSWORDS.find(p => p.value.toLowerCase() === guess);
  if (hit) {
    solved = true;
    card.classList.add("won");
    celebrate();
    notifyAdmin(hit.id);
  } else {
    err.textContent = guess ? "That isn't the password. Check your puzzle and try again." : "Type your password first.";
    input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
    input.focus();
  }
}
document.getElementById("go").addEventListener("click", check);
input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
</script>
</body>
</html>
